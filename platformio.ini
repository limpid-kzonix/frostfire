[platformio]
default_envs = esp32dev

[env:esp32dev]
; ESP32 default target. Change this block to your board if needed.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; Build-time defaults; override by editing AppConfig at runtime when exposed endpoints are used.
build_flags =
  -D FROSTFIRE_FW_NAME=\"Frostfire\"
  -D FROSTFIRE_FW_VERSION=\"0.1.0\"
  -D CORE_DEBUG_LEVEL=3
  ; -D FROSTFIRE_OTA_ENABLED
  ; -D FROSTFIRE_OTA_PASSWORD=\"your-ota-password\"

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
